name: Murekkep IPA Builder

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac (arm64 kuyrugu doluysa macos-26-intel)"
        type: choice
        options: [macos-26, macos-26-intel]
        default: macos-26
      edition:
        description: "Surum (appstore: Murekkep Pro satan App Store surumu)"
        type: choice
        options: [personal, appstore]
        default: personal
      testflight:
        description: "App Store surumunu imzalayip TestFlight'a yukle (yalnizca edition: appstore)"
        type: boolean
        default: false
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    # macOS 26 + Xcode 26.6 (iOS 26.5 SDK): Apple's on-device language model (FoundationModels) is
    # compiled in only with an iOS 26 SDK. When no arm64 Mac picks the job up, GitHub cancels it;
    # the Intel image has the same Xcode at the same path.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    env:
      EDITION: ${{ inputs.edition || 'personal' }}
      TESTFLIGHT: ${{ inputs.testflight && 'yes' || 'no' }}
    steps:
      - name: Projeyi Indir
        uses: actions/checkout@v4

      # The App Store Connect key, tried against Apple before the half-hour build, so a badly pasted
      # secret fails in seconds. Prints the key's shape (lines, line endings), never its content.
      - name: App Store Anahtarini Dogrula
        if: inputs.testflight && inputs.edition == 'appstore'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/asc-check.p8"
          trap 'rm -f "$KEY"' EXIT
          python3 tools/asc_key.py "$KEY" --check-api

      - name: Xcode 26.6 Sec
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      # The embedded voice engine (sherpa-onnx, built for the iPad only) and the Supertonic 3 voices
      # are prepared once and kept in the cache; later builds take them from there in seconds.
      - name: Gomulu Ses Motoru Onbellegi
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: sherpa-out
          key: sherpa-onnx-1.13.8-ort-1.28.2-os64-supertonic3-v1

      - name: Gomulu Ses Motorunu Derle (sherpa-onnx 1.13.8, yalnizca iPad)
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          OUT="$PWD/sherpa-out"
          mkdir -p "$OUT/AppVoices/supertonic3"
          git clone --depth 1 --branch v1.13.8 https://github.com/k2-fsa/sherpa-onnx.git sherpa-src
          cd sherpa-src
          mkdir -p build-ios/ios-onnxruntime/1.28.2
          cd build-ios/ios-onnxruntime/1.28.2
          curl -sSfL -o ort.zip https://github.com/csukuangfj/onnxruntime-libs/releases/download/v1.28.2/onnxruntime-ios-static-xcframework-1.28.2.xcframework.zip
          unzip -q ort.zip
          rm ort.zip
          cd ../..
          ORT="$PWD/ios-onnxruntime/1.28.2/onnxruntime.xcframework"
          export SHERPA_ONNXRUNTIME_LIB_DIR="$ORT/ios-arm64"
          export SHERPA_ONNXRUNTIME_INCLUDE_DIR="$ORT/ios-arm64/onnxruntime.framework/Headers"
          cmake \
            -DBUILD_PIPER_PHONMIZE_EXE=OFF \
            -DBUILD_PIPER_PHONMIZE_TESTS=OFF \
            -DBUILD_ESPEAK_NG_EXE=OFF \
            -DBUILD_ESPEAK_NG_TESTS=OFF \
            -S .. \
            -DCMAKE_TOOLCHAIN_FILE=./toolchains/ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DENABLE_BITCODE=0 \
            -DENABLE_ARC=1 \
            -DENABLE_VISIBILITY=0 \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSHERPA_ONNX_ENABLE_PYTHON=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DSHERPA_ONNX_ENABLE_TESTS=OFF \
            -DSHERPA_ONNX_ENABLE_CHECK=OFF \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_JNI=OFF \
            -DSHERPA_ONNX_ENABLE_C_API=ON \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DDEPLOYMENT_TARGET=13.0 \
            -B build/os64
          cmake --build build/os64 -j 4
          cmake --build build/os64 --target install
          libtool -static -o build/os64/libsherpa-onnx-all.a \
            build/os64/lib/libkaldi-native-fbank-core.a \
            build/os64/lib/libkissfft-float.a \
            build/os64/lib/libsherpa-onnx-c-api.a \
            build/os64/lib/libsherpa-onnx-core.a \
            build/os64/lib/libsherpa-onnx-fstfar.a \
            build/os64/lib/libsherpa-onnx-fst.a \
            build/os64/lib/libsherpa-onnx-kaldifst-core.a \
            build/os64/lib/libkaldi-decoder-core.a \
            build/os64/lib/libucd.a \
            build/os64/lib/libpiper_phonemize.a \
            build/os64/lib/libespeak-ng.a \
            build/os64/lib/libssentencepiece_core.a
          FW=build/os64/SherpaOnnxC.framework
          rm -rf "$FW"
          mkdir -p "$FW/Headers/sherpa-onnx/c-api" "$FW/Modules"
          cp build/os64/libsherpa-onnx-all.a "$FW/SherpaOnnxC"
          cp install/include/sherpa-onnx/c-api/c-api.h "$FW/Headers/sherpa-onnx/c-api/"
          # The module map lets Swift say `import SherpaOnnxC` (and `#if canImport(SherpaOnnxC)`).
          printf 'framework module SherpaOnnxC {\n  header "sherpa-onnx/c-api/c-api.h"\n  export *\n}\n' > "$FW/Modules/module.modulemap"
          cat > "$FW/Info.plist" << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key>
            <string>com.k2-fsa.sherpa-onnx</string>
            <key>CFBundleName</key>
            <string>SherpaOnnxC</string>
            <key>CFBundlePackageType</key>
            <string>FMWK</string>
            <key>CFBundleExecutable</key>
            <string>SherpaOnnxC</string>
            <key>CFBundleVersion</key>
            <string>20260910</string>
            <key>CFBundleShortVersionString</key>
            <string>1.13.8</string>
            <key>MinimumOSVersion</key>
            <string>13.0</string>
            <key>CFBundleSupportedPlatforms</key>
            <array>
              <string>iPhoneOS</string>
            </array>
          </dict>
          </plist>
          PEOF
          xcodebuild -create-xcframework -framework "$FW" -output "$OUT/sherpa-onnx.xcframework"
          cp -RL "$ORT" "$OUT/onnxruntime.xcframework"
          cd ..
          # Supertonic 3: one model, 31 languages (Turkish and English), 5 women's and 5 men's voices.
          curl -sSfL -o voices.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2
          tar xjf voices.tar.bz2
          V=sherpa-onnx-supertonic-3-tts-int8-2026-05-11
          for f in duration_predictor.int8.onnx text_encoder.int8.onnx vector_estimator.int8.onnx vocoder.int8.onnx tts.json unicode_indexer.bin voice.bin LICENSE; do
            cp "$V/$f" "$OUT/AppVoices/supertonic3/"
          done
          ls -la "$OUT" "$OUT/AppVoices/supertonic3"

      - name: Klasor Yapisini Hazirla
        run: |
          which xcodegen || brew install xcodegen
          rm -rf AppSource
          mkdir -p AppSource
          if [ -d "Murekkep.swiftpm" ]; then
            cp -R Murekkep.swiftpm/* AppSource/
          else
            find . -maxdepth 1 -not -name "." -not -name ".git" -not -name ".github" -not -name "AppSource" -not -name "sherpa-out" -not -name "sherpa-src" -exec cp -R {} AppSource/ \;
          fi
          find . -maxdepth 1 -name "*.swift" -not -name "*_2.swift" -exec cp -f {} AppSource/ \;

          python3 - << 'PYEOF'
          import pathlib, shutil

          app_dir = pathlib.Path("AppSource")

          # GitHub'a ayni adla tekrar yuklenen dosyalar "_2" ekiyle gelir: yenisi eskisinin yerine gecer.
          for search_dir in [pathlib.Path("."), pathlib.Path("Murekkep.swiftpm"), app_dir]:
              if not search_dir.exists():
                  continue
              for f in list(search_dir.glob("*_2.swift")):
                  if f.name == "InkShaders_2.swift":
                      main_shader = app_dir / "InkShaders.swift"
                      if main_shader.exists() and "shadeSculptedWave" in main_shader.read_text(encoding="utf-8"):
                          continue
                  clean_name = f.name[:-8] + ".swift"
                  target = app_dir / clean_name
                  if f.resolve() != target.resolve():
                      shutil.copy2(f, target)

          for pattern in ["*_2.swift", "* (1)*", "Package*.swift", "AppInfo*.plist", "*.jpg", "Contents*.json"]:
              for f in list(app_dir.glob(pattern)):
                  if f.is_file():
                      f.unlink(missing_ok=True)
          PYEOF

          # The voice engine and the voices (from the cache or the step above).
          mkdir -p Frameworks
          if [ -d sherpa-out/sherpa-onnx.xcframework ]; then
            cp -R sherpa-out/sherpa-onnx.xcframework sherpa-out/onnxruntime.xcframework Frameworks/
            cp -R sherpa-out/AppVoices AppSource/AppVoices
          fi

          echo "Derlenecek Swift dosyalari: $(ls AppSource/*.swift | wc -l)"

      - name: Info.plist ve Xcode Projesi Olustur
        run: |
          cat << 'EOF' > AppSource/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleLocalizations</key>
              <array>
                  <string>en</string>
                  <string>tr</string>
              </array>
              <key>CFBundleDisplayName</key>
              <string>Mürekkep</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$(MARKETING_VERSION)</string>
              <key>CFBundleVersion</key>
              <string>$(CURRENT_PROJECT_VERSION)</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>ITSAppUsesNonExemptEncryption</key>
              <false/>
              <key>UIDesignRequiresCompatibility</key>
              <true/>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
              </array>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>Video özetlerini Fotoğraflar'a kaydetmek için.</string>
              <key>NSLocalNetworkUsageDescription</key>
              <string>Aynı Wi-Fi'deki bilgisayarında çalışan yapay zekâya (Ollama, LM Studio) bağlanmak için.</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>Dersi kaydetmek için: yazdıkların sesle eşleşir, mürekkebe dokununca o ana gidersin.</string>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          # Permission prompts in the iPad's language (the store's first language is English; the
          # Turkish texts above are only the fallback).
          mkdir -p AppSource/en.lproj AppSource/tr.lproj
          cat << 'EOF' > AppSource/en.lproj/InfoPlist.strings
          "NSMicrophoneUsageDescription" = "Mürekkep records the lecture so your ink stays in sync with the audio: tap any ink to jump to that moment.";
          "NSPhotoLibraryAddUsageDescription" = "Mürekkep saves the video summaries you export to Photos.";
          "NSLocalNetworkUsageDescription" = "Only if you set it up: Mürekkep connects to an AI (Ollama, LM Studio) running on your own computer on the same Wi-Fi.";
          EOF
          cat << 'EOF' > AppSource/tr.lproj/InfoPlist.strings
          "NSMicrophoneUsageDescription" = "Dersi kaydetmek için: yazdıkların sesle eşleşir, mürekkebe dokununca o ana gidersin.";
          "NSPhotoLibraryAddUsageDescription" = "Video özetlerini Fotoğraflar'a kaydetmek için.";
          "NSLocalNetworkUsageDescription" = "Aynı Wi-Fi'deki bilgisayarında çalışan yapay zekâya (Ollama, LM Studio) bağlanmak için.";
          EOF

          # Not: XcodeGen'in "info:" anahtari Info.plist'i her seferinde bastan uretip ustteki ayarlari
          # silerdi (UILaunchScreen gidince uygulama dusuk cozunurlukte acilir). Bu yuzden dosya
          # INFOPLIST_FILE ile oldugu gibi kullaniliyor.
          cat << 'EOF' > project.yml
          name: Murekkep
          options:
            bundleIdPrefix: com.murekkep
            deploymentTarget:
              iOS: "17.0"
          packages:
            MLXSwift:
              url: https://github.com/ml-explore/mlx-swift
              exactVersion: 0.32.3
            MLXSwiftLM:
              url: https://github.com/ml-explore/mlx-swift-lm
              exactVersion: 3.32.3
            SwiftTransformers:
              url: https://github.com/huggingface/swift-transformers
              exactVersion: 1.3.5
          targets:
            Murekkep:
              type: application
              platform: iOS
              sources:
                - path: AppSource
                  excludes:
                    - "Info.plist"
                    - "AppInfo*.plist"
                    - "Package*.swift"
                    - "*_2.swift"
                    - "AppVoices/**"
                    - "PrivacyInfo.xcprivacy"
                    - "*.entitlements"
                - path: AppSource/AppVoices
                  type: folder
                  buildPhase: resources
                - path: AppSource/PrivacyInfo.xcprivacy
                  buildPhase: resources
              dependencies:
                - framework: Frameworks/sherpa-onnx.xcframework
                  embed: false
                - framework: Frameworks/onnxruntime.xcframework
                  embed: false
                - package: MLXSwift
                  product: MLX
                - package: MLXSwiftLM
                  product: MLXLLM
                - package: MLXSwiftLM
                  product: MLXLMCommon
                - package: SwiftTransformers
                  product: Tokenizers
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.murekkep.app
                  PRODUCT_NAME: Murekkep
                  INFOPLIST_FILE: AppSource/Info.plist
                  CODE_SIGN_ENTITLEMENTS: AppSource/Murekkep.entitlements
                  GENERATE_INFOPLIST_FILE: NO
                  MARKETING_VERSION: "3.0"
                  CURRENT_PROJECT_VERSION: "29"
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  OTHER_LDFLAGS: "$(inherited) -lc++ -framework CoreML -framework Accelerate"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
                  ENABLE_USER_SCRIPT_SANDBOXING: NO
          EOF

          # Sade proje: gomulu sesler ve Apple'in cihaz modeli olmadan (MUREKKEP_PLAIN). Ilk derleme
          # olmazsa bununla derlenir, kullanici yine bir IPA alir.
          cat << 'EOF' > project-plain.yml
          name: Murekkep
          options:
            bundleIdPrefix: com.murekkep
            deploymentTarget:
              iOS: "17.0"
          targets:
            Murekkep:
              type: application
              platform: iOS
              sources:
                - path: AppSource
                  excludes:
                    - "Info.plist"
                    - "AppInfo*.plist"
                    - "Package*.swift"
                    - "*_2.swift"
                    - "AppVoices/**"
                    - "PrivacyInfo.xcprivacy"
                    - "*.entitlements"
                - path: AppSource/PrivacyInfo.xcprivacy
                  buildPhase: resources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.murekkep.app
                  PRODUCT_NAME: Murekkep
                  INFOPLIST_FILE: AppSource/Info.plist
                  CODE_SIGN_ENTITLEMENTS: AppSource/Murekkep.entitlements
                  GENERATE_INFOPLIST_FILE: NO
                  MARKETING_VERSION: "3.0"
                  CURRENT_PROJECT_VERSION: "29"
                  SWIFT_VERSION: "5.0"
                  SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MUREKKEP_PLAIN"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
                  ENABLE_USER_SCRIPT_SANDBOXING: NO
          EOF

          # App Store surumu: her sey acik yerine Murekkep Pro'yu satar (APPSTORE bayragi, StoreKit).
          # project.yml'den MLX'siz proje kesilmeden once eklenir; uc derleme de bayragi alir.
          if [ "$EDITION" = "appstore" ]; then
          python3 - << 'PYEOF'
          import os
          for name in ["project.yml", "project-plain.yml"]:
              text = open(name, encoding="utf-8").read()
              if "MUREKKEP_PLAIN" in text:
                  text = text.replace("MUREKKEP_PLAIN\"", "MUREKKEP_PLAIN APPSTORE\"")
              else:
                  text = text.replace("SWIFT_VERSION: \"5.0\"",
                                      "SWIFT_VERSION: \"5.0\"\n        SWIFT_ACTIVE_COMPILATION_CONDITIONS: \"$(inherited) APPSTORE\"")
              assert "APPSTORE" in text, name
              # iPad only: marked for iPhone too, review would want iPhone screenshots and test it there.
              text = text.replace("TARGETED_DEVICE_FAMILY: \"1,2\"", "TARGETED_DEVICE_FAMILY: \"2\"")
              assert "TARGETED_DEVICE_FAMILY: \"2\"" in text, name
              # Its own bundle ID (App Store Connect: Murekkep, team DW66Y98N3Z), so it installs next to
              # the personal build; version 1.0 on the store, and a new build number for every upload.
              text = text.replace("PRODUCT_BUNDLE_IDENTIFIER: com.murekkep.app",
                                  "PRODUCT_BUNDLE_IDENTIFIER: com.murekkep.notebook")
              text = text.replace("MARKETING_VERSION: \"3.0\"", "MARKETING_VERSION: \"1.0\"")
              if os.environ.get("TESTFLIGHT") == "yes":
                  build = 100 + int(os.environ["GITHUB_RUN_NUMBER"])
                  text = text.replace("CURRENT_PROJECT_VERSION: \"29\"", f"CURRENT_PROJECT_VERSION: \"{build}\"")
              assert "com.murekkep.notebook" in text and "MARKETING_VERSION: \"1.0\"" in text, name
              open(name, "w", encoding="utf-8").write(text)
          PYEOF
          fi

          # MLX'siz proje: tam proje, indirilebilir model (MLX) paketleri olmadan. MLX derlenemezse
          # sesler ve Apple'in cihaz modeli bununla korunur.
          python3 - << 'PYEOF'
          lines = open("project.yml", encoding="utf-8").read().split("\n")
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line == "packages:":
                  # the block and its indented lines
                  i += 1
                  while i < len(lines) and lines[i].startswith("  "):
                      i += 1
                  continue
              if line.strip().startswith("- package:"):
                  # the dependency and its product line
                  i += 2
                  continue
              out.append(line)
              i += 1
          open("project-nomlx.yml", "w", encoding="utf-8").write("\n".join(out))
          PYEOF
          if grep -q "package" project-nomlx.yml; then
            echo "::warning::project-nomlx.yml hala paket iceriyor"
          fi

      # MLX compiles its GPU kernels with Xcode's Metal toolchain (a separate component in Xcode 26).
      - name: Metal Araclari (indirilebilir model icin)
        continue-on-error: true
        run: |
          xcrun -sdk iphoneos metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Swift Paket Onbellegi
        uses: actions/cache@v4
        with:
          path: spm
          key: spm-mlx-0.32.3-lm-3.32.3-tf-1.3.5-v1

      - name: IPA Derle
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          if [ ! -d Frameworks/sherpa-onnx.xcframework ]; then
            echo "Ses motoru yok; sade projeye geciliyor."
            exit 1
          fi
          xcodegen generate --spec project.yml
          xcodebuild -project Murekkep.xcodeproj \
            -scheme Murekkep \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: MLX'siz Derleme (ilk derleme olmazsa)
        id: nomlx
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "::warning::Indirilebilir model (MLX) ile derleme olmadi; o olmadan derleniyor (sesler ve Apple'in cihaz modeli duruyor). Ilk derlemenin hatalari asagida."
          if [ -f build.log ]; then
            grep -E "error:" build.log | sort -u | head -80 || true
          fi
          if [ ! -d Frameworks/sherpa-onnx.xcframework ]; then
            echo "Ses motoru yok; sade projeye geciliyor."
            exit 1
          fi
          rm -rf build Murekkep.xcodeproj
          xcodegen generate --spec project-nomlx.yml
          xcodebuild -project Murekkep.xcodeproj \
            -scheme Murekkep \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-nomlx.log

      - name: Sade Derleme (ilk derleme olmazsa)
        if: steps.build.outcome == 'failure' && steps.nomlx.outcome != 'success'
        run: |
          set -o pipefail
          echo "::warning::Ilk derleme olmadi; gomulu sesler ve Apple'in cihaz modeli olmadan sade derleme yapiliyor. Onceki derlemelerin hatalari asagida."
          for f in build.log build-nomlx.log; do
            if [ -f "$f" ]; then
              echo "== $f"
              grep -E "error:" "$f" | sort -u | head -80 || true
            fi
          done
          rm -rf build Murekkep.xcodeproj AppSource/AppVoices
          xcodegen generate --spec project-plain.yml
          xcodebuild -project Murekkep.xcodeproj \
            -scheme Murekkep \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-plain.log

      - name: IPA Paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Murekkep.app Payload/
          # The build is unsigned; signed ad hoc with the larger memory limit, so Sideloadly and
          # SideStore see the entitlement and keep it when they sign the app again.
          find Payload/Murekkep.app -name "*.framework" -o -name "*.dylib" | while read -r f; do
            codesign --force --sign - "$f" || true
          done
          if ! codesign --force --sign - --entitlements AppSource/Murekkep.entitlements --generate-entitlement-der Payload/Murekkep.app; then
            echo "::warning::IPA bellek izniyle imzalanamadi; imzasiz paketleniyor."
          fi
          codesign -d --entitlements - Payload/Murekkep.app 2>/dev/null || true
          IPA=Murekkep.ipa
          if [ "$EDITION" = "appstore" ]; then IPA=Murekkep-AppStore.ipa; fi
          zip -qry "$IPA" Payload
          ls -la "$IPA"

      # App Store edition, only when asked: an unsigned archive of the project that built above (no
      # development profile or registered device needed), signed ad hoc with the larger memory limit so
      # the entitlement survives, then exported with Apple's cloud-managed distribution certificate
      # through the App Store Connect API key and uploaded to TestFlight.
      - name: TestFlight'a Yukle
        # Only the full build: the fallback builds (no MLX, plain) lack the model engine.
        if: inputs.testflight && inputs.edition == 'appstore' && steps.build.outcome == 'success'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$KEY"' EXIT
          python3 tools/asc_key.py "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          if ! xcodebuild -project Murekkep.xcodeproj \
            -scheme Murekkep \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Murekkep.xcarchive \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath spm \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee archive.log; then
            echo "::error::Arsiv alinamadi."
            exit 1
          fi
          APP=build/Murekkep.xcarchive/Products/Applications/Murekkep.app
          find "$APP" -name "*.framework" -o -name "*.dylib" | while read -r f; do
            codesign --force --sign - "$f"
          done
          codesign --force --sign - --entitlements AppSource/Murekkep.entitlements --generate-entitlement-der "$APP"
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>DW66Y98N3Z</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <false/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF
          if ! xcodebuild -exportArchive \
            -archivePath build/Murekkep.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath export \
            "${AUTH[@]}" 2>&1 | tee export.log; then
            if grep -qiE "cloud signing permission|cloud managed distribution" export.log; then
              echo "::error::Apple bulut imzasi bu API anahtariyla calismadi; anahtarin Admin yetkisi gerekiyor. App Store Connect > Integrations'ta Admin yetkili yeni bir anahtar olustur, ASC_KEY_ID ve ASC_KEY_P8 secret'larini guncelle."
            fi
            grep -E "error:|Error" export.log | sort -u | head -40 || true
            exit 1
          fi
          echo "TestFlight'a yuklendi: App Store Connect > TestFlight'ta 15-30 dakikada 'Test Edilebilir' olur."

      - name: Derleme Hatalarini Goster
        if: failure()
        run: |
          for f in build.log build-nomlx.log build-plain.log archive.log export.log; do
            if [ -f "$f" ]; then
              echo "== $f"
              grep -E "error:|warning: .*(will be an error|unable to type-check)" "$f" | sort -u | head -80 || true
            fi
          done

      - name: IPA Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.edition == 'appstore' && 'Murekkep-AppStore' || 'Murekkep-IPA' }}
          path: Murekkep*.ipa
